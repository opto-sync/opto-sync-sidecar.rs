# flags-2-env surface for `opto-sync-sidecar`
[identity]
service = "opto-sync-sidecar"
type_name = "SidecarEnv"

[help]
url = "https://github.com/opto-sync/opto-sync-sidecar.rs"
columns = ["options", "env", "type", "default", "description"]

[parse]
allow_unknown = false

[flags.bind]
env = "OPTO_SYNC_SIDECAR_BIND"
long = "bind"
type = "string"
default = "127.0.0.1:9090"
help = "HTTP listen address for /healthz /readyz /metrics."
