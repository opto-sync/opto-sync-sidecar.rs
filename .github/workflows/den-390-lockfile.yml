name: DEN-390 lockfile
on:
  push:
    branches: [DEN-390-canonical-sidecar-v1]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: DEN-390-canonical-sidecar-v1
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate exact Cargo lock
        run: cargo generate-lockfile
      - name: Commit generated lock when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m "DEN-390: update Cargo lock for canonical sidecar runtime"
          git push origin HEAD:DEN-390-canonical-sidecar-v1
