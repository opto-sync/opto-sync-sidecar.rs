name: Sidecar contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tjsv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ores-otel/ores-otel-sidecar.rs
          ref: 357cca21dfe6878c1855c04d60ea57353284b509
          path: .contract-owner
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TypeSpec resolver packages
        run: npm install --no-save --package-lock=false --ignore-scripts @typespec/compiler@1.15.0 @typespec/json-schema@1.15.0
      - name: Render TOML as contract instance
        run: |
          mkdir -p .tjsv-instances/OresSidecarFile/valid
          python - <<'PY'
          import json, pathlib, tomllib
          data = tomllib.loads(pathlib.Path('.ores-sidecar.toml').read_text())
          pathlib.Path('.tjsv-instances/OresSidecarFile/valid/config.json').write_text(json.dumps(data, sort_keys=True))
          PY
      - name: Compare first-class TypeSpec and JSON Schema authorities
        uses: ORESoftware/typespec-json-schema-validator@7241f8e52dcc4518c72f0fdb5152d6cf66c86656
        with:
          typespec: .contract-owner/contracts/sidecar/main.tsp
          schema: .contract-owner/contracts/sidecar/authored.schema.json
          instances: .tjsv-instances
          report: .tjsv-instances/report.json
          sarif: ''
          quiet: 'false'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-contract-tjsv
          path: .tjsv-instances/report.json
          if-no-files-found: warn
          retention-days: 14
